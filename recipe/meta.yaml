{% set name = "noisemonitor" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/noisemonitor-{{ version }}.tar.gz
  sha256: cc34c3e03a8e219289db6ac0088d606b6010b4d9a252b14a8735fcf864a4ed6c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base >=3.5.3
    - numpy >=1.22.4
    - pandas >=2.2
    - python-calamine >=0.4.0
    - openpyxl >=3.1.2
    - requests >=2.25.0
    - aiohttp >=3.8.0
    - lxml >=4.6.0
    - python-dateutil >=2.8.0

test:
  imports:
    - noisemonitor
    - noisemonitor.weather
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/valerianF/noisemonitor
  summary: A Python package for sound level data analysis
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - valerianF
